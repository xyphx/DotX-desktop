syntax = "proto3";

package com.xyphx.grpc;

option java_multiple_files = true;
option java_package = "com.xyphx.grpc.proto";
option java_outer_classname = "UserProto";
option csharp_namespace = "DotX.Api.Grpc.Protos";

service AuthService {
  rpc GetUserByApiKey (ApiKeyRequest) returns (UserResponse) {}
}

message ApiKeyRequest {
  string api_key = 1;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string name = 3;
  string picture = 4;
  string auth_provider = 5;
}
