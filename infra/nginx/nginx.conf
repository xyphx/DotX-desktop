server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://server:8080/;
    }

    location /agent/ {
        proxy_pass http://agent:8000/;
    }
}
