version: "3.9"

services:
  client:
    build:
      context: .
      dockerfile: infra/docker/client.Dockerfile
    ports:
      - "3000:80"

  server:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
    ports:
      - "8080:8080"

  agent:
    build:
      context: .
      dockerfile: infra/docker/agent.Dockerfile
    ports:
      - "8000:8000"
